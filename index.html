<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boxing Interval Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Boxing Timer</h1>

    <div id="setup" class="setup">
      <div class="setting">
        <label for="rounds">Rounds</label>
        <div class="stepper">
          <button class="stepper-btn" data-target="rounds" data-dir="-1">−</button>
          <span id="rounds">3</span>
          <button class="stepper-btn" data-target="rounds" data-dir="1">+</button>
        </div>
      </div>

      <div class="setting">
        <label for="roundTime">Round Time (min)</label>
        <div class="stepper">
          <button class="stepper-btn" data-target="roundTime" data-dir="-1">−</button>
          <span id="roundTime">3</span>
          <button class="stepper-btn" data-target="roundTime" data-dir="1">+</button>
        </div>
      </div>

      <div class="setting">
        <label for="restTime">Rest Time (min)</label>
        <div class="stepper">
          <button class="stepper-btn" data-target="restTime" data-dir="-1">−</button>
          <span id="restTime">1</span>
          <button class="stepper-btn" data-target="restTime" data-dir="1">+</button>
        </div>
      </div>

      <div class="setting">
        <label for="prepTime">Prep Time (sec)</label>
        <div class="stepper">
          <button class="stepper-btn" data-target="prepTime" data-dir="-1">−</button>
          <span id="prepTime">10</span>
          <button class="stepper-btn" data-target="prepTime" data-dir="1">+</button>
        </div>
      </div>

      <button id="startBtn" class="start-btn">START</button>
    </div>

    <div id="timer" class="timer hidden">
      <div id="phaseLabel" class="phase-label">GET READY</div>
      <div id="roundLabel" class="round-label">Round 1 / 3</div>
      <div id="clock" class="clock">0:10</div>
      <div class="controls">
        <button id="pauseBtn" class="control-btn">PAUSE</button>
        <button id="resetBtn" class="control-btn">RESET</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
